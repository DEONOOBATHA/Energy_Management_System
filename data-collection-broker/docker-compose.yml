version: '3.8'

services:
  data-collection-broker:
    image: rabbitmq:3-management
    container_name: data-collection-broker
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: root
      RABBITMQ_DEFAULT_PASS: root
    ports:
      - "5673:5672"      # Different port from synch-rabbitmq (5672)
      - "15673:15672"    # Management UI on different port (15672)
    volumes:
      - data_collection_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - sd-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  data_collection_rabbitmq_data:
    driver: local

networks:
  sd-network:
    external: true
    name: synch-rabbitmq_sd-network
