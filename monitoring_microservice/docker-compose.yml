services:
  monitoring_database:
    image: postgres:latest
    container_name: monitoring_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: monitoring
    ports:
      - "5436:5432"
    volumes:
      - monitoring_db_data:/var/lib/postgresql
    networks:
      - sd-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  monitoring-service:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      monitoring_database:
        condition: service_healthy
    environment:
      DB_IP: monitoring_database
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: root
      DB_DBNAME: monitoring
      PORT: 8083
      SYNC_RABBITMQ_HOST: synch-rabbitmq
      SYNC_RABBITMQ_PORT: 5672
      SYNC_RABBITMQ_USER: root
      SYNC_RABBITMQ_PASS: root
      DATA_COLLECTION_RABBITMQ_HOST: data-collection-broker
      DATA_COLLECTION_RABBITMQ_PORT: 5672
      DATA_COLLECTION_RABBITMQ_USER: root
      DATA_COLLECTION_RABBITMQ_PASS: root
      REPLICA_ID: ${REPLICA_ID:-1}
    networks:
      - sd-network
    labels:
      - "traefik.enable=true"
      # API routes with load balancing across replicas
      - "traefik.http.routers.monitoring-service.rule=Host(`localhost`) && PathPrefix(`/api/energy`)"
      - "traefik.http.routers.monitoring-service.entrypoints=web"
      - "traefik.http.routers.monitoring-service.service=monitoring-service"
      - "traefik.http.services.monitoring-service.loadbalancer.server.port=8083"
      - "traefik.http.routers.monitoring-service.middlewares=cors-headers@file"
      - "traefik.http.routers.monitoring-service.priority=100"
      # Swagger UI route
      - "traefik.http.routers.monitoring-swagger.rule=Host(`localhost`) && PathPrefix(`/monitoring/swagger-ui`)"
      - "traefik.http.routers.monitoring-swagger.entrypoints=web"
      - "traefik.http.routers.monitoring-swagger.service=monitoring-service"
      - "traefik.http.routers.monitoring-swagger.middlewares=cors-headers@file"
      - "traefik.http.routers.monitoring-swagger.priority=200"

volumes:
  monitoring_db_data:
    driver: local

networks:
  sd-network:
    external: true
    name: synch-rabbitmq_sd-network
