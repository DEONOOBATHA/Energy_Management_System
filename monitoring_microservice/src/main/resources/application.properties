# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_IP:localhost}:${DB_PORT:5432}/${DB_DBNAME:monitoring}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# RabbitMQ Configuration - Sync Broker (for user/device synchronization)
spring.rabbitmq.host=${SYNC_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SYNC_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SYNC_RABBITMQ_USER:root}
spring.rabbitmq.password=${SYNC_RABBITMQ_PASS:root}

# Data Collection Broker Configuration (for energy consumption data)
data.collection.rabbitmq.host=${DATA_COLLECTION_RABBITMQ_HOST:localhost}
data.collection.rabbitmq.port=${DATA_COLLECTION_RABBITMQ_PORT:5673}
data.collection.rabbitmq.username=${DATA_COLLECTION_RABBITMQ_USER:root}
data.collection.rabbitmq.password=${DATA_COLLECTION_RABBITMQ_PASS:root}

# Server Configuration
server.port=${PORT:8083}

# Application Configuration
spring.application.name=monitoring-service
