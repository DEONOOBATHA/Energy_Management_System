# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_IP:localhost}:${DB_PORT:5432}/${DB_DBNAME:websocket}
spring.datasource.username=${DB_USER:postgres}  
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:root}
spring.rabbitmq.password=${RABBITMQ_PASS:root}
# Server Configuration
server.port=${PORT:8084}
# Application Configuration
spring.application.name=websocket-service
# WebSocket Configuration
websocket.endpoint=/ws
websocket.allowed-origins=*
# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.example.websocket=DEBUG
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
# Notification Settings
notification.expiration-minutes=${NOTIFICATION_EXPIRATION_MINUTES:1440}
notification.max-per-user=${NOTIFICATION_MAX_PER_USER:100}
# WebSocket Message Broker Configuration
websocket.broker.prefix=/topic
websocket.application.prefix=/app
# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
# Security Configuration
security.enable-websocket-auth=${SECURITY_ENABLE_WEBSOCKET_AUTH:false}
# JWT Configuration
jwt.key=${JWT_KEY}               