server.port=${PORT:8085}
spring.application.name=chat-service

spring.datasource.url=jdbc:postgresql://${DB_IP:chat-db}:${DB_PORT:5432}/${DB_DBNAME:chatdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.rabbitmq.host=synch-rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=root
spring.rabbitmq.password=root

google.ai.api.key=${GOOGLE_AI_API_KEY:}
google.ai.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

chat.max-history-size=50
chat.ai-enabled=true
chat.rule-based-enabled=true

logging.level.com.sscl.chat=DEBUG
logging.level.org.springframework.amqp=DEBUG
