# RabbitMQ Configuration File
# https://www.rabbitmq.com/configure.html

# Default TCP listener (AMQP protocol)
# For local development, use port 5672
listeners.tcp.default = 5672

# Management plugin - Web UI
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0

# For Heroku deployment, uncomment this line to use dynamic PORT
# This will be overridden by rabbitmq-env.conf when PORT is set
# listeners.tcp.default = ${PORT}

# Logging
log.console = true
log.console.level = info
log.file = false

# Default user credentials (can be overridden by environment variables)
# default_user = admin
# default_pass = admin

# Virtual host configuration
default_vhost = /
default_user_tags.administrator = true
default_permissions.configure = .*
default_permissions.read = .*
default_permissions.write = .*

# Memory and disk thresholds
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 50MB

# Connection settings
heartbeat = 60
frame_max = 131072
channel_max = 2047
