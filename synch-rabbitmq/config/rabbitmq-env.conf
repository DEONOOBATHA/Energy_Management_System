# RabbitMQ Environment Configuration
# https://www.rabbitmq.com/configure.html#customise-environment

# Node name (important for clustering)
NODENAME=rabbit@synch-rabbitmq

# For Heroku deployment - use dynamic PORT
# When deployed to Heroku, this will read the PORT environment variable
# and configure RabbitMQ to listen on that port instead of default 5672
# Uncomment the line below for Heroku deployment:
# RABBITMQ_NODE_PORT=${PORT}

# For local development, comment out the line above and RabbitMQ will use
# the default port 5672 as configured in rabbitmq.conf

# Management plugin port (usually not changed)
# RABBITMQ_MANAGEMENT_PORT=15672

# Erlang distribution port (for clustering)
# RABBITMQ_DIST_PORT=25672

# Enable management plugin by default
# RABBITMQ_ENABLED_PLUGINS_FILE=/etc/rabbitmq/enabled_plugins
