# Application
spring.application.name=energy-simulator

# RabbitMQ Configuration (Data Collection Broker)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5673}
spring.rabbitmq.username=${RABBITMQ_USER:root}
spring.rabbitmq.password=${RABBITMQ_PASS:root}

# Database (pentru citit user_id din user_device)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:device}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# Simulator Configuration
simulator.interval=${INTERVAL_SECONDS:30}000
simulator.device.id=${DEVICE_ID:}

# Logging
logging.level.com.example.simulator=INFO
logging.level.org.springframework.amqp=WARN
